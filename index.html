<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fixed: previously pointed at /vite.svg, which doesn't exist in
         public/ — the browser tab showed no icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ashutosh Aman" />

    <title>Ashutosh Aman — Full-Stack Developer</title>
    <meta
      name="description"
      content="Ashutosh Aman is a Full-Stack Developer specializing in React, Node.js and TypeScript — building scalable web applications from rapid MVPs to production-grade fintech systems. Open to opportunities."

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ashutosh Aman — Portfolio" />
    <meta property="og:title" content="Ashutosh Aman — Full-Stack Developer" />

      property="og:description"
      content="Full-Stack Developer specializing in React, Node.js and TypeScript — building scalable web applications from rapid MVPs to production-grade fintech systems."

    <meta property="og:url" content="https://hireme.vercel.app/" />
    <meta property="og:image" content="https://hireme.vercel.app/avatar.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ashutosh Aman — Full-Stack Developer" />

      name="twitter:description"
      content="Full-Stack Developer specializing in React, Node.js and TypeScript — building scalable web applications from rapid MVPs to production-grade fintech systems."

    <meta name="twitter:image" content="https://hireme.vercel.app/avatar.jpg" />

        "@context": "https://schema.org",
        "@type": "Person",
